# 안내 방 그림 찍기 — 손으로만 돌림(261119) · 열쇠는 실행 입력으로만(가려서) · 그림은 guide 가지
name: 안내 방 그림 찍기
on:
  workflow_dispatch:
    inputs:
      key:
        description: '시험 방 열쇠(비우면 손님 화면만)'
        required: false
        default: ''
      key2:
        description: '(준비용) 같은 시험 방 다른 멤버 열쇠'
        required: false
        default: ''
      undo:
        description: '(되돌리기) 기기표|기록번호'
        required: false
        default: ''
      prep_r:
        description: '(준비용) 다른 멤버가 ♥ 할 시험 방 게시물 번호 R-…'
        required: false
        default: ''
      prep:
        description: '1 = 시험 방에 견본 사진 한 장 올리고 다른 멤버가 ♥ (18 · 20편 그림용)'
        required: false
        default: '0'
permissions:
  contents: write
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 열쇠 가리기
        run: |
          K=$(jq -r '.inputs.key // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$K" ]; then echo "::add-mask::$K"; echo "KEY=$K" >> "$GITHUB_ENV"; fi
          K2=$(jq -r '.inputs.key2 // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$K2" ]; then echo "::add-mask::$K2"; echo "KEY2=$K2" >> "$GITHUB_ENV"; fi
          echo "UNDO=$(jq -r '.inputs.undo // ""' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"
          echo "PREP_R=$(jq -r '.inputs.prep_r // ""' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"
          echo "PREP=$(jq -r '.inputs.prep // "0"' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/selfcheck
            seed/run
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd .github/selfcheck
          npm init -y >/dev/null
          npm i playwright-core@1.48.2 >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
          node guide.mjs
      - name: 그림을 guide 가지에 올림
        run: |
          cd .github/selfcheck/guide
          git init -q -b guide && git add . && git -c user.name=guide -c user.email=guide@uriyagi.kr commit -q -m "guide $(date -u +%F_%H%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" guide
