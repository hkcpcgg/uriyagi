# 안내 방 그림 찍기 — 손으로만 돌림(261118)
name: 화면 그림 찍기
on:
  workflow_dispatch:
    inputs:
      room:
        description: '찍을 방 번호'
        required: false
        default: 'C-0294'
      gn:
        description: '안내 방 몇 번째 게시물을 더 찍을지(예: 2,5)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/selfcheck
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd .github/selfcheck
          npm init -y >/dev/null
          npm i playwright-core@1.48.2 >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
          ROOM="${{ inputs.room }}" GN="${{ inputs.gn }}" node shots.mjs
      - name: 그림을 shots 가지에 올림(사이트 main 과 따로 · 클로드가 받아 봄)
        run: |
          cd .github/selfcheck/shots
          git init -q -b shots && git add . && git -c user.name=shots -c user.email=shots@uriyagi.kr commit -q -m "shots $(date -u +%F_%H%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
