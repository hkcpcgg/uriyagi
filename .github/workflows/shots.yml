# 안내 방 그림 찍기 — 손으로만 돌림(261118)
name: 화면 그림 찍기
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/selfcheck
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd .github/selfcheck
          npm init -y >/dev/null
          npm i playwright-core@1.48.2 >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
          node shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: .github/selfcheck/shots
