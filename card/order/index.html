$('bNx').onclick=function(){ if(!can()){ return; } if(S.i===5){ send(); return; } S.i++; save(); paint(); window.scrollTo(0,0); if(S.i===2&&!S.read){ readBoth(); } };

function send(){ var b=$('bNx'); b.disabled=true; b.textContent='신청하는 중입니다…';
 var F=S.F, o={action:'recCardOrder',ck:S.ck,rq:rq(),front:S.front,back:S.back,face:S.face,hrs:S.hrs,hm:S.hm?'1':'',shw:S.shw?'1':'',ml:S.menu.filter(function(m){ return m[0]||m[1]; }).map(function(m){ return [m[0],m[1],m[2],'']; }),ll:S.links.map(function(l){ return [l.u,l.t]; }),
  map:S.mapOn&&F.addr?S.map:'',way:S.wayOn?S.way:'',wayu:S.wayOn?S.wayu:'',src:JSON.stringify(S.src),search:S.seo?'1':'',self:'1',allow:S.ag.allow?'1':'',terms:S.ag.terms?'1':'',privacy:S.ag.privacy?'1':'',use:S.ag.use?'1':'',fix:S.fin?'1':'',fin:S.fin?'1':'',fresh:ls('uri_order_fresh')==='1'?'1':''};
 FL.forEach(function(k){ o[k[0]]=F[k[0]]||''; });
 post(o,function(r){ b.textContent='확정하고 신청';
  if(r.status!=='ok'){ b.disabled=false; if(r.reason==='NOT_OPEN'){ toast('주문 받기는 곧 열립니다. 카카오 채널로 이어 드립니다.'); setTimeout(function(){ location.href=CHAN; },1200); return; } if(r.reason==='NO_KEY'){ S.ck=''; ls('uri_card_ck',null); S.i=0; paint(); toast('카카오로 다시 로그인해 주세요'); return; } toast(r.msg||'신청하지 못했습니다'); return; }
  ls('uri_order_fresh',null); S.ord={no:r.no,goods:r.goods,near:r.near,stage:r.stage||'접수'}; S.i=6; ls(DK,null); paint(); window.scrollTo(0,0);
  if(window.UriPay){ UriPay.render($('payBox'),{item:r.item,no:r.no,oid:r.oid,goods:r.goods,ck:S.ck,rec:GAS},function(on){ if(on){ $('payBox').scrollIntoView({behavior:'smooth',block:'center'}); } }); } }); }

load(); if(S.i===6&&!S.ord){ S.i=0; }

if(code){ history.replaceState(null,'',location.pathname); S.login=1; paint();
 post({action:'recCardIn',code:code,redirect:KREDIR},function(r){ S.login=0; if(r.status!=='ok'){ toast('카카오 로그인을 다시 해 주세요'); paint(); return; } S.ck=r.ck; S.who=r.name||''; ls('uri_card_ck',S.ck); paint(); }); }
else if(sp.get('kerr')){ history.replaceState(null,'',location.pathname); toast('카카오 로그인이 되지 않았습니다. 다시 해 주세요.'); paint(); }
else { paint(); if(S.ck){ post({action:'recCardMine',ck:S.ck},function(r){ if(r.status!=='ok'){ S.ck=''; ls('uri_card_ck',null); if(S.i>0){ S.i=0; toast('카카오로 다시 로그인해 주세요'); } } else { S.who=r.name||''; } paint(); }); } }
window.addEventListener('pageshow',function(e){ if(e.persisted){ location.reload(); } });
})();
